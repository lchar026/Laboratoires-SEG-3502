<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Calculatrice</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div>
    <h1>Calculatrice</h1>
    <div th:switch="${error}">
        <p th:case="'FormatError'">
            Valeur invalide - veuillez entrer des nombres
        </p>
        <p th:case="'DivisionByZeroError'">
            Division par zéro impossible
        </p>
        <p th:case="'InvalidOperationError'">
            Opération invalide
        </p>
    </div>
    <form th:action="@{/calculate}" method="get">
        <table>
            <tr>
                <td><label for="num1">Premier nombre:</label></td>
                <td><input id="num1" th:name="num1" th:value="${num1}"></td>
            </tr>
            <tr>
                <td><label for="num2">Second nombre:</label></td>
                <td><input id="num2" th:name="num2" th:value="${num2}"></td>
            </tr>
            <tr>
                <td><label>Résultat:</label></td>
                <td><span th:text="${result}"></span></td>
            </tr>
            <tr>
                <td colspan="2">
                    <button type="submit" th:name="operation" th:value="'add'">+</button>
                    <button type="submit" th:name="operation" th:value="'sub'">-</button>
                    <button type="submit" th:name="operation" th:value="'mul'">*</button>
                    <button type="submit" th:name="operation" th:value="'div'">/</button>
                </td>
            </tr>
        </table>
    </form>
</div>
</body>
</html>
