<div class="container">
  <h2>Author Search</h2>
  <form [formGroup]="searchForm" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label for="id">Author ID:</label>
      <input type="number" id="id" class="form-control" formControlName="id" required>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="searchForm.invalid">Search</button>
  </form>

</div>
